name: TikTok Restreamer

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js v22 (Required by yt-dlp)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Deno v2.x
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade --pre yt-dlp yt-dlp-ejs streamlink
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create Cookies File
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          echo "$YOUTUBE_COOKIES" > cookies.txt

      - name: Run Restreamer Script
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          RESTREAM_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: python main.py
